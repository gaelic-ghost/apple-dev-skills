name: Validate Compatibility Pointer

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Validate compatibility pointer docs
        run: bash .github/scripts/validate_repo_docs.sh
